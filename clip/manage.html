<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Clip — スニペットと設定</title>
    <script type="module" src="/src/manage.ts" defer></script>
  </head>
  <body class="manage">
    <nav class="tabs">
      <button class="tab" data-tab="snippets">スニペット</button>
      <button class="tab" data-tab="settings">設定<span id="update-dot" class="tab-dot" title="新しいバージョンがあります" hidden></span></button>
      <span id="open-hint" class="open-hint"></span>
    </nav>

    <section id="tab-snippets" class="snippets-tab">
      <aside class="snippet-side">
        <ul id="snippet-list" class="snippet-list"></ul>
        <div class="side-actions">
          <button id="add" class="button">＋ 追加</button>
          <span class="spacer"></span>
          <button id="up" class="icon-btn" title="上へ">
            <svg viewBox="0 0 16 16"><path d="M8 12.5v-9M4 7.5l4-4 4 4" /></svg>
          </button>
          <button id="down" class="icon-btn" title="下へ">
            <svg viewBox="0 0 16 16"><path d="M8 3.5v9M4 8.5l4 4 4-4" /></svg>
          </button>
        </div>
      </aside>

      <div class="editor">
        <div class="presets">
          <span class="presets-title">よく使う項目を追加</span>
          <div id="presets" class="chips"></div>
        </div>

        <form id="editor-form" class="editor-form" hidden>
          <label class="field">
            <span>名前</span>
            <input id="label" type="text" placeholder="例：会社のメールアドレス" autocomplete="off" />
          </label>
          <label class="field grow">
            <span>入力する内容</span>
            <textarea id="text" placeholder="この内容がそのまま入力されます。改行も入ります" spellcheck="false"></textarea>
          </label>
          <div class="editor-actions">
            <span id="saved" class="muted"></span>
            <span class="spacer"></span>
            <button id="delete" type="button" class="button danger">削除</button>
          </div>
        </form>

        <div id="editor-empty" class="editor-empty">
          <p>メールアドレスや電話番号、住所、署名などを登録しておくと、<span class="shortcut-text"></span> で呼び出してすぐ入力できます。</p>
          <p>上の「よく使う項目」か、左下の「＋ 追加」から登録してください。</p>
        </div>
      </div>
    </section>

    <section id="tab-settings" class="settings-tab" hidden>
      <div class="settings-page">
        <p id="settings-error" class="warning" hidden></p>

        <section class="settings-section">
          <h2>呼び出すショートカット</h2>
          <div id="shortcuts" class="rows"></div>
          <p id="shortcut-warning" class="warning section-note" hidden></p>
        </section>

        <section class="settings-section">
          <h2>コピーの履歴</h2>
          <div class="rows">
            <label class="s-row clickable" for="record">
              <span class="s-text">
                <span class="s-label">コピーの履歴を記録する</span>
                <span class="s-hint">パスワード管理ソフトなど、記録しないよう印を付けてコピーしたものは記録しません。テキストだけを記録します。</span>
              </span>
              <button id="record" type="button" role="switch" aria-checked="false" class="switch"></button>
            </label>
            <div class="s-row">
              <span class="s-text"><label for="limit" class="s-label">残す件数</label></span>
              <select id="limit"></select>
            </div>
            <div class="s-row">
              <span class="s-text"><label for="days" class="s-label">残す期間</label></span>
              <select id="days"></select>
            </div>
            <div class="s-row">
              <span class="s-text">
                <span class="s-label">履歴を消去</span>
                <span class="s-hint">スニペットは消えません</span>
              </span>
              <button id="clear-history" type="button" class="button small">消去…</button>
            </div>
          </div>
        </section>

        <section id="accessibility" class="settings-section" hidden>
          <h2>自動で入力</h2>
          <div class="rows">
            <div class="s-row">
              <span class="s-text">
                <span class="s-label">アクセシビリティの許可</span>
                <span id="accessibility-status" class="s-hint"></span>
              </span>
              <button id="allow" type="button" class="button small">許可する…</button>
            </div>
          </div>
        </section>

        <section id="update" class="settings-section">
          <h2>アップデート</h2>
          <div class="rows">
            <div class="s-row">
              <img class="app-icon" src="/src-tauri/icons/128x128@2x.png" alt="" draggable="false" />
              <span class="s-text">
                <span class="s-label"><strong>Clip</strong> <span id="version" class="muted"></span></span>
                <span id="update-status" class="s-hint"></span>
              </span>
              <span class="s-actions">
                <button id="release-notes" type="button" class="button small" hidden>更新内容 ↗</button>
                <button id="install-update" type="button" class="button small primary" hidden>更新して再起動</button>
                <button id="check-update" type="button" class="button small">アップデートを確認</button>
              </span>
            </div>
            <label class="s-row clickable" for="auto-update">
              <span class="s-text">
                <span class="s-label">アップデートを自動で確認する</span>
                <span class="s-hint">起動して少したってからと、そのあと 1 日に 1 回確認し、新しいバージョンがあるときだけ知らせます</span>
              </span>
              <button id="auto-update" type="button" role="switch" aria-checked="true" class="switch"></button>
            </label>
            <div class="s-row">
              <span class="s-text">
                <span class="s-label">このバージョンの更新内容</span>
                <span class="s-hint">GitHub のリリースのページを開きます</span>
              </span>
              <button id="this-release" type="button" class="button small">GitHub で見る ↗</button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </body>
</html>
