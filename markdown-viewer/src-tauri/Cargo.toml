[package]
name = "markdown-viewer"
version = "0.1.0"
description = "Markdown のファイルを読みやすく表示する（見るだけ）"
authors = ["2204601"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name, which clash
# on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Markdown → HTML (render.rs). Without the default features: those are the
# command line tool and syntect, and the code is colored in the page
# (src/lib/highlight.ts).
comrak = { version = "1", default-features = false }
# Files that aren't UTF-8 are read as Shift_JIS (render.rs `decode`): older
# files made on Windows in Japanese.
encoding_rs = "0.8"
# Pictures go to the page as data: URLs (commands.rs `read_image`). Already
# in the tree through Tauri.
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The window opens at the size and place it had when last closed.
tauri-plugin-window-state = "2"
# A second launch (a .md opened from Explorer) hands its file to the running window (lib.rs).
tauri-plugin-single-instance = "2"
# Warnings and errors into a file in the app's log folder (lib.rs, src/lib/log.ts).
tauri-plugin-log = "2"

# Platform Distribution §7. Measured on stockroom: thin LTO rebuilds 2.5x
# faster than fat LTO + 1 unit, for about +0.5 MB in the installer.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# The system proxy (proxy.rs).
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

# System proxy lookup (PAC) for the updater, see proxy.rs.
[target."cfg(target_os = \"macos\")".dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
# The mock runtime: commands called through IPC as the frontend calls them (tests/ipc.rs).
tauri = { version = "2", features = ["test"] }
